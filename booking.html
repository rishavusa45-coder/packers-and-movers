<!DOCTYPE html>
<html>
<head>
    <title>Booking Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .form-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h2 {
            text-align: center;
        }

        input, textarea, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #25D366;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="form-box">

    <h2>Book Your Service</h2>

    <form onsubmit="sendWhatsApp(); return false;">

        <input type="text" id="name" placeholder="Your Name" required>

        <input type="tel" id="phone" placeholder="Your Phone Number" required>

        <input type="text" id="pickup" placeholder="Pickup Location" required>

        <input type="text" id="drop" placeholder="Drop Location" required>

        <input type="date" id="date" required>

        <textarea id="message" placeholder="Any other details"></textarea>

        <button type="submit">
            Send Details on WhatsApp
        </button>

    </form>

</div>

<script>

function sendWhatsApp() {

    // YOUR WHATSAPP NUMBER
    var whatsappNumber = "919931394186";

    var name = document.getElementById("name").value;
    var phone = document.getElementById("phone").value;
    var pickup = document.getElementById("pickup").value;
    var drop = document.getElementById("drop").value;
    var date = document.getElementById("date").value;
    var message = document.getElementById("message").value;

    var text =
        "Hello, I want to book your service.%0A%0A" +
        "*Name:* " + name + "%0A" +
        "*Phone:* " + phone + "%0A" +
        "*Pickup:* " + pickup + "%0A" +
        "*Drop:* " + drop + "%0A" +
        "*Date:* " + date + "%0A" +
        "*Details:* " + message;

    var url = "https://wa.me/" + whatsappNumber + "?text=" + text;

    window.open(url, "_blank");
}

</script>

</body>
</html>
